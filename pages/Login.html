  <script>
    tailwind.config = {
      darkMode: "class",

        colors: {

  <style>

    html, body { min-height: 100%; }
    body { margin:0; font-family: Inter, "IBM Plex Sans Arabic", Segoe UI, sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; }
    body::before { content:""; pointer-events:none; position:fixed; inset:0; background: radial-gradient(42rem 28rem at 8% -8%, var(--glow), transparent 58%), radial-gradient(36rem 24rem at 96% 0%, rgba(96,165,250,.08), transparent 55%); z-index:0; }
    [x-cloak] { display:none !important; }
    .tabular { font-variant-numeric: tabular-nums; }
    .bg-surface\/90 { background: color-mix(in srgb, var(--surface) 90%, transparent); }
    .bg-surface\/80 { background: color-mix(in srgb, var(--surface) 80%, transparent); }
    .bg-surface\/70 { background: color-mix(in srgb, var(--surface) 70%, transparent); }
    .bg-raised\/70 { background: color-mix(in srgb, var(--raised) 70%, transparent); }
    .bg-raised\/60 { background: color-mix(in srgb, var(--raised) 60%, transparent); }
    .bg-accent\/10 { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .bg-accent\/15 { background: color-mix(in srgb, var(--accent) 15%, transparent); }
    .bg-accent\/20 { background: color-mix(in srgb, var(--accent) 20%, transparent); }
    .bg-teal\/15 { background: color-mix(in srgb, var(--teal) 15%, transparent); }
    .text-fg\/80 { color: color-mix(in srgb, var(--fg) 80%, transparent); }
    .hover\:border-accent\/40:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .hover\:border-accent\/30:hover { border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .focus\:border-accent\/50:focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    @keyframes nav-reconnect { 0%{transform:translateX(-120%)} 100%{transform:translateX(320%)} }
    .nav-reconnect-bar { animation: nav-reconnect 1.4s ease-in-out infinite; }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 55%, transparent); border-radius:99px; }
  </style>
</head>
<body class="grid min-h-screen place-items-center px-4" x-data="loginPage()" x-init="boot()" x-cloak>
  <form @submit.prevent="submit()" class="w-full max-w-md rounded-3xl border border-line bg-surface p-8 shadow-[0_20px_60px_rgba(0,0,0,0.16)]">
    <img src="../Img/icons/144.svg" alt="" class="mx-auto h-16 w-16 rounded-2xl bg-[#1e293b] object-contain" />
    <p class="mt-4 text-center text-[11px] font-bold uppercase tracking-[0.2em] text-accent" x-text="t.APP_MARK"></p>
    <h1 class="mt-2 text-center text-2xl font-extrabold" x-text="t.AUTH.TITLE"></h1>
    <p class="mt-1 text-center text-sm text-muted" x-text="t.AUTH.SUBTITLE"></p>
    <template x-if="error"><div class="mt-4 rounded-lg bg-rose-500/10 p-3 text-sm text-rose-500" x-text="error"></div></template>
    <label class="mt-6 block text-xs font-bold text-muted">
      <span x-text="t.AUTH.METHOD"></span>
      <input x-model="Method" required class="mt-1 h-11 w-full rounded-xl border border-line bg-raised px-3 text-sm font-semibold text-fg outline-none focus:border-accent/50" />
    </label>
    <label class="mt-4 block text-xs font-bold text-muted">
      <span x-text="t.AUTH.PASSWORD"></span>
      <input type="password" x-model="Password" required class="mt-1 h-11 w-full rounded-xl border border-line bg-raised px-3 text-sm font-semibold text-fg outline-none focus:border-accent/50" />
    </label>
    <button type="submit" :disabled="loading" class="mt-6 h-11 w-full rounded-xl bg-accent text-sm font-extrabold text-accent-fg disabled:opacity-60" x-text="loading ? t.AUTH.SIGNIN_LOADING : t.AUTH.SIGNIN"></button>
    <div class="mt-5 flex items-center justify-between text-xs font-semibold text-muted">
      <a href="Landing.html" class="hover:text-accent" x-text="t.LANDING.Nav.BACK"></a>
      <div class="flex gap-3">
        <button type="button" @click="toggleLang()" x-text="t.RTL ? 'English' : 'العربية'"></button>
        <button type="button" @click="toggleTheme()" x-text="theme==='dark' ? t.THEME.LIGHT : t.THEME.DARK"></button>
      </div>
    </div>
  </form>
