  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: { extend: {
        colors: {
          bg: "var(--bg)", fg: "var(--fg)", muted: "var(--muted)", surface: "var(--surface)",
          raised: "var(--raised)", line: "var(--line)", accent: "var(--accent)", "accent-fg": "var(--accent-fg)", teal: "var(--teal)", ink: "var(--ink)",
        },
        fontFamily: { sans: ["Inter","IBM Plex Sans Arabic","Segoe UI","sans-serif"] },
      } }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  undefined<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg:#eef3fb; --fg:#0b1528; --muted:#5b6b86; --surface:#ffffff; --raised:#f4f7fc; --line:rgba(15,35,70,.12); --accent:#3b82f6; --accent-fg:#ffffff; --teal:#16a34a; --ink:#0b1528; --glow:rgba(59,130,246,.16); }
    .dark { --bg:#07111f; --fg:#e8eef8; --muted:#93a4c0; --surface:#0d1b33; --raised:#122240; --line:rgba(148,163,184,.16); --accent:#3b82f6; --accent-fg:#ffffff; --teal:#22c55e; --ink:#e8eef8; --glow:rgba(59,130,246,.22); }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin:0; font-family: Inter, "IBM Plex Sans Arabic", Segoe UI, sans-serif; background:var(--bg); color:var(--fg); -webkit-font-smoothing:antialiased; }
    body::before { content:""; pointer-events:none; position:fixed; inset:0; background: radial-gradient(42rem 28rem at 8% -8%, var(--glow), transparent 58%), radial-gradient(36rem 24rem at 96% 0%, rgba(96,165,250,.08), transparent 55%); z-index:0; }
    [x-cloak] { display:none !important; }
    .tabular { font-variant-numeric: tabular-nums; }
    .bg-surface\/90 { background: color-mix(in srgb, var(--surface) 90%, transparent); }
    .bg-surface\/80 { background: color-mix(in srgb, var(--surface) 80%, transparent); }
    .bg-surface\/70 { background: color-mix(in srgb, var(--surface) 70%, transparent); }
    .bg-raised\/70 { background: color-mix(in srgb, var(--raised) 70%, transparent); }
    .bg-raised\/60 { background: color-mix(in srgb, var(--raised) 60%, transparent); }
    .bg-accent\/10 { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .bg-accent\/15 { background: color-mix(in srgb, var(--accent) 15%, transparent); }
    .bg-accent\/20 { background: color-mix(in srgb, var(--accent) 20%, transparent); }
    .bg-teal\/15 { background: color-mix(in srgb, var(--teal) 15%, transparent); }
    .text-fg\/80 { color: color-mix(in srgb, var(--fg) 80%, transparent); }
    .hover\:border-accent\/40:hover { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .hover\:border-accent\/30:hover { border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    .focus\:border-accent\/50:focus { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    @keyframes nav-reconnect { 0%{transform:translateX(-120%)} 100%{transform:translateX(320%)} }
    .nav-reconnect-bar { animation: nav-reconnect 1.4s ease-in-out infinite; }
    ::-webkit-scrollbar { width:8px; height:8px; }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--muted) 55%, transparent); border-radius:99px; }
  </style>
</head>

  <header class="fixed top-0 z-20 flex h-16 items-center justify-between border-b border-line bg-surface/80 px-4 backdrop-blur-xl transition-all duration-300" :class="open ? 'start-64 w-[calc(100%-16rem)]' : 'start-[4.25rem] w-[calc(100%-4.25rem)]'">

    <div class="flex items-center gap-1.5 rounded-full border border-line bg-raised/60 p-1">

            <button type="button" class="inline-flex items-center gap-1 text-xs font-bold text-accent" x-text="t.MARK_ALL"></button>
          </div>

              <li class="px-3 py-2.5">

                <p class="text-xs text-muted" x-text="n.NotifyItem"></p>

  <main class="min-h-screen pt-16 transition-all duration-300" :class="open ? 'ps-64' : 'ps-[4.25rem]'">
    <div class="p-3 lg:p-4">
      
      <div class="flex flex-col gap-3">
        <section class="flex flex-wrap items-end justify-between gap-3 rounded-2xl border border-line bg-surface px-5 py-4">
          <div>
            <p class="text-[11px] font-bold uppercase tracking-[0.18em] text-accent" x-text="today"></p>
            <h1 class="mt-1 text-2xl font-extrabold tracking-tight" x-text="t.GREETING"></h1>
            <p class="mt-1 max-w-xl text-sm text-muted" x-text="t.GREETING_SUB"></p>
          </div>
          <p class="text-xs font-semibold text-muted" x-text="t.DASHBOARD.LIVE"></p>
        </section>
        <section class="grid grid-cols-2 gap-3 sm:grid-cols-3 xl:grid-cols-7">
          <template x-for="[key,value] in Object.entries(counters)" :key="key">
            <button type="button" @click="goStat(key)" class="group relative overflow-hidden rounded-2xl border border-line bg-surface p-4 text-start shadow-[0_10px_30px_rgba(0,0,0,0.06)] transition hover:-translate-y-0.5 hover:border-accent/30" :style="'--stat-accent:'+(accents[key]||'#e8a317')">
              <span class="absolute inset-y-0 start-0 w-1.5 bg-[var(--stat-accent)]"></span>
              <div class="flex items-start justify-between gap-3 ps-2">

                </div>
                <span class="grid h-11 w-11 place-items-center rounded-2xl text-sm font-extrabold text-white" :style="'background:'+(accents[key]||'#e8a317')" x-text="key.slice(0,1)"></span>
              </div>
            </button>
          </template>
        </section>
        <section class="grid min-h-0 flex-1 gap-3 lg:grid-cols-[minmax(0,1.7fr)_minmax(17rem,0.9fr)]">
          <section class="flex h-[24rem] flex-col rounded-2xl border border-line bg-surface p-4">
            <div class="mb-3 flex flex-wrap items-center gap-2">
              <div>
                <p class="text-[11px] font-bold uppercase tracking-[0.16em] text-accent" x-text="t.DASHBOARD.OVERVIEW"></p>
                <h2 class="text-base font-extrabold" x-text="t.DASHBOARD.STATISTICS"></h2>
              </div>

                  <select x-model="chartType" class="h-9 rounded-xl border border-line bg-raised px-3 text-xs font-semibold outline-none focus:border-accent/50">
                    <option value="month" x-text="t.CALENDER.MONTH"></option>
                    <option value="year" x-text="t.CALENDER.YEAR"></option>
                  </select>
                  <label class="flex items-center gap-1.5 text-xs text-muted"><span class="hidden sm:inline" x-text="t.FROM"></span><input type="date" class="h-9 rounded-xl border border-line bg-raised px-2 text-xs font-semibold text-fg outline-none" /></label>
                  <label class="flex items-center gap-1.5 text-xs text-muted"><span class="hidden sm:inline" x-text="t.TO"></span><input type="date" class="h-9 rounded-xl border border-line bg-raised px-2 text-xs font-semibold text-fg outline-none" /></label>
                </div>
                <button type="button" class="grid h-9 w-9 place-items-center rounded-xl border border-line bg-raised hover:border-accent/40"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
              </div>
            </div>
            <div class="min-h-0 flex-1"><canvas id="areaChart"></canvas></div>
          </section>
          <section class="flex h-[24rem] flex-col rounded-2xl border border-line bg-surface p-4">

              <h2 class="text-base font-extrabold" x-text="t.DASHBOARD.TOTAL"></h2>
            </div>
            <div class="relative min-h-0 flex-1">
              <canvas id="donutChart"></canvas>
              <div class="pointer-events-none absolute inset-0 grid place-items-center">
                <div class="text-center">
                  <p class="text-[11px] font-semibold text-muted" x-text="t.DASHBOARD.TOTAL"></p>

                </div>
              </div>
            </div>
            <ul class="mt-1 grid grid-cols-2 gap-x-3 gap-y-1.5 text-xs">
              <template x-for="item in donutSeries" :key="item.name">
                <li class="flex items-center gap-2">
                  <span class="h-2 w-2 rounded-full" :style="'background:'+item.color"></span>
                  <span class="truncate text-muted" x-text="item.name"></span>
                  <span class="ms-auto tabular font-bold" x-text="item.value.toLocaleString()"></span>
                </li>
              </template>
            </ul>
          </section>
        </section>
        <section class="rounded-2xl border border-line bg-surface p-4">
          <h2 class="text-sm font-extrabold" x-text="t.DASHBOARD.ACTIVITY"></h2>
          <ul class="mt-3 divide-y divide-line">
            <template x-for="item in activity" :key="item.NotifyId">
              <li class="flex items-center gap-3 py-2.5">

                  <p class="truncate text-sm font-semibold" x-text="item.NotifyType || item.NotifyItem"></p>
                  <p class="text-xs text-muted" x-text="item.NotifyItem"></p>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </div>
    </div>

function novaApp(){
  return {
    open: localStorage.sidebar !== "0",
    theme: localStorage.theme || "light",
    langKey: localStorage.lang || "en",
    t: EN,
    menuOpen: false,
    notifOpen: false,
    toastMsg: "",
    notifs: [{"NotifyId":1,"NotifyType":"Customer","NotifyItem":"Horizon Labs added"},{"NotifyId":2,"NotifyType":"Contract","NotifyItem":"Q3 retainer signed"},{"NotifyId":3,"NotifyType":"User","NotifyItem":"Sara joined Sales"},{"NotifyId":4,"NotifyType":"Request","NotifyItem":"Upgrade request #1842"},{"NotifyId":5,"NotifyType":"Meeting","NotifyItem":"Kickoff with Northwind"}],
    boot(){
      this.t = this.langKey === "ar" ? AR : EN;
      document.documentElement.classList.toggle("dark", this.theme === "dark");
      document.documentElement.lang = this.langKey;
      document.documentElement.dir = this.t.RTL ? "rtl" : "ltr";
      this.$watch("open", v => localStorage.sidebar = v ? "1" : "0");
      this.$nextTick(() => {
        window.lucide && lucide.createIcons();
        this.bootCharts && this.bootCharts();
        this.applyTab && this.applyTab();
        if (this.notes && this.activeId) {
          const n = this.notes.find((x) => x.NId == this.activeId);
          if (n) { this.title = n.NTitle; this.body = n.NBody; this.tags = n.NTags || []; }
        }
      });
    },
    toggleTheme(){
      this.theme = this.theme === "dark" ? "light" : "dark";
      localStorage.theme = this.theme;
      document.documentElement.classList.toggle("dark", this.theme === "dark");
    },
    toggleLang(){
      this.langKey = this.langKey === "ar" ? "en" : "ar";
      localStorage.lang = this.langKey;
      this.t = this.langKey === "ar" ? AR : EN;
      document.documentElement.lang = this.langKey;
      document.documentElement.dir = this.t.RTL ? "rtl" : "ltr";
    },
    toast(msg){ this.toastMsg = msg; setTimeout(() => this.toastMsg = "", 1600); },
    formLabel(key){ return (this.t.FORMS && this.t.FORMS[key]) || key; },
    
    counters: {"User":48,"Customer":1264,"Contract":892,"Package":18,"Nitch":24,"SubSectionSub":36,"Branch":7},
    accents: {"User":"#3b82f6","Customer":"#22c55e","Contract":"#38bdf8","Package":"#f472b6","Nitch":"#f59e0b","SubSectionSub":"#a78bfa","Branch":"#818cf8"},
    activity: [{"NotifyId":1,"NotifyType":"Customer","NotifyItem":"Horizon Labs added"},{"NotifyId":2,"NotifyType":"Contract","NotifyItem":"Q3 retainer signed"},{"NotifyId":3,"NotifyType":"User","NotifyItem":"Sara joined Sales"},{"NotifyId":4,"NotifyType":"Request","NotifyItem":"Upgrade request #1842"},{"NotifyId":5,"NotifyType":"Meeting","NotifyItem":"Kickoff with Northwind"}],
    series: [{"period":"01-2026","contract":54,"customer":92},{"period":"02-2026","contract":61,"customer":104},{"period":"03-2026","contract":48,"customer":97},{"period":"04-2026","contract":72,"customer":121},{"period":"05-2026","contract":69,"customer":118},{"period":"06-2026","contract":81,"customer":136},{"period":"07-2026","contract":76,"customer":129},{"period":"08-2026","contract":88,"customer":148}],
    chartType: "month",
    today: new Intl.DateTimeFormat(undefined,{weekday:"long",month:"long",day:"numeric"}).format(new Date()),
    get donutSeries(){
      return Object.entries(this.counters).map(([name,value])=>({name:this.t.SIDEBAR[name]||name,value,color:this.accents[name]||"#64748b"}));
    },
    get donutTotal(){ return Object.values(this.counters).reduce((s,n)=>s+Number(n||0),0); },
    goStat(key){
      if(key==="Customer") location.href="mgmt/CustomerPage.html";
      else if(key==="Contract") location.href="mgmt/ContractPage.html";
      else location.href="Admin.html?tab="+key;
    },
    bootCharts(){
      const area = document.getElementById("areaChart");
      const donut = document.getElementById("donutChart");
      if(!area || !window.Chart) return;
      new Chart(area, { type:"line", data:{ labels:this.series.map(s=>s.period), datasets:[
        { label:this.t.SIDEBAR.Contract, data:this.series.map(s=>s.contract), borderColor:"#38bdf8", backgroundColor:"rgba(56,189,248,.28)", fill:true, tension:.35, borderWidth:2.4, pointRadius:0 },
        { label:this.t.SIDEBAR.Customer, data:this.series.map(s=>s.customer), borderColor:"#22c55e", backgroundColor:"rgba(34,197,94,.24)", fill:true, tension:.35, borderWidth:2.4, pointRadius:0 },
      ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ grid:{display:false} }, y:{ grid:{ color:"rgba(28,22,14,0.08)" }, ticks:{ callback:(v)=>v } } } } });
      new Chart(donut, { type:"doughnut", data:{ labels:this.donutSeries.map(s=>s.name), datasets:[{ data:this.donutSeries.map(s=>s.value), backgroundColor:this.donutSeries.map(s=>s.color), borderWidth:3, borderColor:getComputedStyle(document.documentElement).getPropertyValue("--surface")||"#fff", spacing:3 }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:"62%", plugins:{legend:{display:false}} } });
    },
  
  };
}
